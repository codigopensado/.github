name: Issue Branch Bot

on:
  workflow_call: 
  issues:
    types: [opened, edited, labeled]

jobs:
  create-issue-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Validate and Create Linked Branch
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TARGET_LABEL: ${{ vars.TRIGGER_LABEL }}
          ALLOWED_TEAM: ${{ vars.ALLOWED_TEAM_SLUG }}
          ORG: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          USER: ${{ github.actor }}
          LABELS: ${{ toJson(github.event.issue.labels) }}
        run: |
          if [[ ! $(echo "$LABELS" | jq -r '.[].name' | grep -xF "$TARGET_LABEL") ]]; then
            echo "No-op: Label '$TARGET_LABEL' não encontrada."
            exit 0
          fi

          echo "Verificando se $USER pertence ao time $ALLOWED_TEAM..."
          TEAM_STATUS=$(gh api /orgs/$ORG/teams/$ALLOWED_TEAM/memberships/$USER \
            --jq '.state' 2>/dev/null || echo "not_found")
          
          if [[ "$TEAM_STATUS" != "active" ]]; then
            echo "Erro: Usuário $USER não tem permissão."
            exit 1
          fi

          BRANCH_NAME="branchbot/story/$ISSUE_NUMBER"
          REPO_NODE_ID=$(gh api "repos/$ORG/$REPO" --jq '.node_id')
          
          DEFAULT_BRANCH=$(gh api "repos/$ORG/$REPO" --jq '.default_branch')
          SHA=$(gh api "repos/$ORG/$REPO/commits/$DEFAULT_BRANCH" --jq '.sha')

          echo "Criando e vinculando branch $BRANCH_NAME a partir da $DEFAULT_BRANCH ($SHA)..."

          gh api graphql -f query='
            mutation($issueId: ID!, $repoId: ID!, $name: String!, $oid: GitObjectID!) {
              createLinkedBranch(input: {
                issueId: $issueId, 
                repositoryId: $repoId, 
                name: $name, 
                oid: $oid
              }) {
                linkedBranch {
                  ref {
                    name
                  }
                }
              }
            }' -f issueId="$ISSUE_NODE_ID" \
               -f repoId="$REPO_NODE_ID" \
               -f name="$BRANCH_NAME" \
               -f oid="$SHA"

          echo "Sucesso: Branch $BRANCH_NAME criada e vinculada com sucesso."
